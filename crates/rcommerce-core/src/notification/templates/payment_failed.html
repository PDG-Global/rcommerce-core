<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1a1a1a;">Payment failed</h1>
<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">Hi {{ customer_name }}, we couldn't process your payment of <strong style="color:#1a1a1a;">{{ amount }}</strong> for order <strong style="color:#1a1a1a;">{{ order_number }}</strong>.</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px 0;background-color:#fdf3ef;border:1px solid #f5d5c8;">
  <tr>
    <td style="padding:16px;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">Error</div>
      <div style="font-size:14px;font-weight:bold;color:#1a1a1a;">{{ error_message }}</div>
    </td>
  </tr>
</table>

<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">No worries — your order is still reserved. Please try again with a different payment method.</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px 0;">
  <tr>
    <td align="center" bgcolor="#ff4d00" style="border-radius:4px;">
      <a href="{{ retry_url }}" target="_blank" style="display:inline-block;padding:12px 28px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">Retry Payment</a>
    </td>
  </tr>
</table>
