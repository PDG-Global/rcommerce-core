<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1a1a1a;">Payment update required</h1>
<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">Hi {{ customer_name }}, we were unable to process your payment of <strong style="color:#1a1a1a;">{{ amount }}</strong> for order <strong style="color:#1a1a1a;">{{ order_number }}</strong>.</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px 0;background-color:#f7f7f7;border:1px solid #ececec;">
  <tr>
    <td style="padding:16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td width="50%" valign="top" style="padding-right:8px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">Order Number</div>
            <div style="font-size:14px;font-weight:bold;color:#1a1a1a;">{{ order_number }}</div>
          </td>
          <td width="50%" valign="top">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">Amount</div>
            <div style="font-size:14px;font-weight:bold;color:#ff4d00;">{{ amount }}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">Please update your payment method to keep your order on track — it only takes a minute.</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px 0;">
  <tr>
    <td align="center" bgcolor="#ff4d00" style="border-radius:4px;">
      <a href="{{ retry_url }}" target="_blank" style="display:inline-block;padding:12px 28px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">Update Payment Method</a>
    </td>
  </tr>
</table>
