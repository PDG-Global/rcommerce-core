<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1a1a1a;">You left something in your cart</h1>
<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">Hi {{ customer_name }}, these items are still waiting for you. Complete your purchase before they're gone!</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 8px 0;">
  <tr>
    <th align="left" style="font-family:Helvetica,Arial,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;font-weight:bold;padding:0 0 8px 0;border-bottom:2px solid #1a1a1a;">Item</th>
    <th align="right" width="100" style="font-family:Helvetica,Arial,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;font-weight:bold;padding:0 0 8px 0;border-bottom:2px solid #1a1a1a;">Price</th>
  </tr>
  {{ cart_items }}
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="240" align="right" style="margin:8px 0 24px 0;">
  <tr>
    <td style="padding:10px 0 0 0;border-top:2px solid #1a1a1a;font-size:15px;font-weight:bold;color:#1a1a1a;">Cart Total</td>
    <td align="right" style="padding:10px 0 0 0;border-top:2px solid #1a1a1a;font-size:15px;font-weight:bold;color:#ff4d00;">{{ cart_total }}</td>
  </tr>
</table>
<div style="clear:both;"></div>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px 0;">
  <tr>
    <td align="center" bgcolor="#ff4d00" style="border-radius:4px;">
      <a href="{{ cart_url }}" target="_blank" style="display:inline-block;padding:12px 28px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">Complete Your Order</a>
    </td>
  </tr>
</table>

<p style="margin:16px 0 0 0;font-size:13px;line-height:1.6;color:#777777;">Discount code: <span style="font-family:'Courier New',monospace;font-weight:bold;color:#1a1a1a;">{{ discount_code }}</span></p>
