<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1a1a1a;">Subscription cancelled</h1>
<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">Hi {{ customer_name }}, your subscription to <strong style="color:#1a1a1a;">{{ plan_name }}</strong> has been cancelled as requested.</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px 0;background-color:#f7f7f7;border:1px solid #ececec;">
  <tr>
    <td style="padding:16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td width="34%" valign="top" style="padding-right:8px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">Plan</div>
            <div style="font-size:14px;font-weight:bold;color:#1a1a1a;">{{ plan_name }}</div>
          </td>
          <td width="33%" valign="top" style="padding-right:8px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">Cancelled On</div>
            <div style="font-size:14px;font-weight:bold;color:#1a1a1a;">{{ cancellation_date }}</div>
          </td>
          <td width="33%" valign="top">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">Access Until</div>
            <div style="font-size:14px;font-weight:bold;color:#ff4d00;">{{ access_until }}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:14px;line-height:1.6;color:#555555;">Reason: {{ reason }}<br>You can resubscribe at any time — we'd love to have you back.</p>
