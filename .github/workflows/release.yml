name: release

# Publishes a GitHub release for a version tag. Fires on tag push; the
# manual trigger publishes an existing tag (used for tags cut before
# this workflow existed). Notes come from the tag's own CHANGELOG.md
# section — a missing section fails the run rather than publishing
# empty or generated notes. Uses the workflow's own GITHUB_TOKEN with
# the narrowest permission that can publish a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # The GH_TOKEN step after this needs no persisted git credentials.
          persist-credentials: false
      - name: Extract the tag's changelog section
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          awk -v v="$ver" '
            $0 ~ "^## " v "([^0-9]|$)" { in_sec = 1; next }
            in_sec && /^## / { exit }
            in_sec { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG.md section for $TAG"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
